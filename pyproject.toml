[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-hub"
version = "0.2.0"
description = "Adquisición deportiva, dominio y API independiente para datos de fútbol."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
scraping = ["seleniumbase==4.55.2"]
scraping-playwright = ["playwright>=1.55"]
# Starlette 1.7's TestClient imports httpx2; httpx is only its deprecated fallback.
dev = ["httpx2", "pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
